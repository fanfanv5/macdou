<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision" role="img" aria-labelledby="title desc">
  <title id="title">Mac 菜单栏状态环设计示意</title>
  <desc id="desc">参考 iPhone Duo 的开口电量弧、居中 Wi-Fi 和底部状态结构。电量弧始终保留浅色轨道，深色弧线表示当前电量。Mac 版将底部状态映射为音量档位。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
      .heading { fill: #18202b; font-size: 25px; font-weight: 700; }
      .sub { fill: #627080; font-size: 13px; }
      .card { fill: #fff; stroke: #dfe5ec; stroke-width: 1; }
      .label { fill: #18202b; font-size: 17px; font-weight: 600; }
      .detail { fill: #627080; font-size: 13px; }
      .glyph { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <symbol id="wifi" viewBox="0 0 22 22" preserveAspectRatio="xMidYMid meet">
      <g transform="translate(0 .7)">
        <path d="M6.9 9.2a6.1 6.1 0 0 1 8.2 0M8.7 11.3a3.6 3.6 0 0 1 4.6 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="butt"/>
        <g fill="currentColor">
          <circle cx="6.9" cy="9.2" r=".8"/>
          <circle cx="15.1" cy="9.2" r=".8"/>
          <circle cx="8.7" cy="11.3" r=".8"/>
          <circle cx="13.3" cy="11.3" r=".8"/>
          <circle cx="11" cy="13.3" r="1"/>
        </g>
      </g>
    </symbol>
    <symbol id="ring" viewBox="0 0 22 22">
      <path d="M4.5 16.5 A8 8 0 1 1 17.5 16.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="dots" viewBox="0 0 22 22" preserveAspectRatio="xMidYMid meet">
      <circle cx="6.3" cy="17.4" r=".95" fill="currentColor"/>
      <circle cx="9.45" cy="18.2" r=".95" fill="currentColor"/>
      <circle cx="12.55" cy="18.2" r=".95" fill="currentColor"/>
      <circle cx="15.7" cy="17.4" r=".95" fill="currentColor"/>
    </symbol>
  </defs>

  <rect width="900" height="460" rx="18" fill="#f5f7fa"/>
  <text x="38" y="51" class="heading">Mac 状态环 · 菜单栏方案</text>
  <text x="38" y="74" class="sub">电量弧保留浅色轨道；Mac 版底部状态表示音量档位</text>

  <rect x="38" y="99" width="824" height="46" rx="13" fill="#ffffff" stroke="#dfe5ec"/>
  <text x="57" y="128" fill="#313a45" font-size="14" font-weight="600">Finder</text>
  <text x="118" y="128" fill="#536071" font-size="14">文件　编辑　显示　前往　窗口　帮助</text>
  <text x="679" y="128" fill="#536071" font-size="13">周六 10:24</text>
  <g transform="translate(815 111)" style="color:#263242">
    <use href="#ring" width="22" height="22" opacity=".2"/>
    <path d="M4.5 16.5 A8 8 0 1 1 17.5 16.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="29 50"/>
    <use href="#wifi" width="22" height="22"/>
    <use href="#dots" width="22" height="22"/>
  </g>

  <g transform="translate(38 173)">
    <rect class="card" width="260" height="241" rx="17"/>
    <g transform="translate(77.2 20) scale(4.8)" style="color:#243246">
      <use href="#ring" width="22" height="22" opacity=".2"/>
      <path d="M4.5 16.5 A8 8 0 1 1 17.5 16.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="29 50"/>
      <use href="#wifi" width="22" height="22"/>
      <use href="#dots" width="22" height="22"/>
    </g>
    <text x="23" y="165" class="label">正常 · 72%</text>
    <text x="23" y="189" class="detail">浅色轨道常驻；深色弧为电量</text>
    <text x="23" y="210" class="detail">底部状态：音量档位（Mac）</text>
  </g>

  <g transform="translate(320 173)">
    <rect class="card" width="260" height="241" rx="17"/>
    <g transform="translate(77.2 20) scale(4.8)" style="color:#ad4b26">
      <use href="#ring" width="22" height="22" opacity=".2"/>
      <path d="M4.5 16.5 A8 8 0 1 1 17.5 16.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 50"/>
      <use href="#wifi" width="22" height="22"/>
      <use href="#dots" width="22" height="22"/>
    </g>
    <text x="23" y="165" class="label">低电量 · 15%</text>
    <text x="23" y="189" class="detail">浅色轨道不随电量消失</text>
    <text x="23" y="210" class="detail">Wi‑Fi 与底部状态位置固定</text>
  </g>

  <g transform="translate(602 173)">
    <rect class="card" width="260" height="241" rx="17"/>
    <g transform="translate(77.2 20) scale(4.8)" style="color:#536071">
      <use href="#ring" width="22" height="22" opacity=".2"/>
      <path d="M4.5 16.5 A8 8 0 1 1 17.5 16.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="20 50"/>
      <use href="#wifi" width="22" height="22" opacity=".34"/>
      <path d="M7.4 7.5 14.7 14.8" transform="translate(0 .7)" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      <use href="#dots" width="22" height="22"/>
    </g>
    <text x="23" y="165" class="label">Wi‑Fi 断开 · 50%</text>
    <text x="23" y="189" class="detail">环仍显示电量</text>
    <text x="23" y="210" class="detail">Wi‑Fi 变淡并加斜线</text>
  </g>

  <text x="38" y="443" class="sub">示意图放大展示结构；菜单栏实际图标建议使用约 18 × 18 pt 的单色矢量。</text>
</svg>
